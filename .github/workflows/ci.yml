name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal token scope; the jobs only need to read the checked-out code.
permissions:
  contents: read

jobs:
  # A merge to main normally re-tests nothing new: the ruleset demands a PR whose
  # required checks passed with the branch up to date, so the merged tree is the
  # one CI already tested. This gate proves that for the pushed commit (merged
  # PR, same tree as its tested head, all required checks green on that head)
  # and then lets the heavy jobs skip, so CI on main finishes in seconds and the
  # Deploy workflow (which waits for a successful CI run on a push to main)
  # starts right away. Anything else - a direct push, an admin bypass, a tree
  # mismatch, a missing or failed check - runs the full CI as before.
  pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Was this exact tree already tested in its PR?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REQUIRED: "quality web frontend e2e image"
        run: |
          set -euo pipefail
          tested=false
          if [ "$EVENT" = "push" ]; then
            pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\" and .base.ref == \"main\")][0] // empty")
            if [ -n "$pr" ]; then
              num=$(jq -r .number <<<"$pr")
              head=$(jq -r .head.sha <<<"$pr")
              merged_tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha)
              head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)
              echo "PR #$num, head $head; tree merged=$merged_tree head=$head_tree"
              if [ "$merged_tree" = "$head_tree" ]; then
                runs=$(gh api --paginate "repos/$REPO/commits/$head/check-runs?per_page=100" --jq '.check_runs[]')
                tested=true
                for name in $REQUIRED; do
                  # Latest run of that check on the PR head.
                  c=$(jq -rs --arg n "$name" \
                    '[.[] | select(.name == $n)] | sort_by(.started_at) | last | .conclusion // "missing"' <<<"$runs")
                  echo "  $name: $c"
                  [ "$c" = "success" ] || tested=false
                done
              fi
            else
              echo "No merged PR for $SHA (direct push?)"
            fi
          fi
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"

  quality:
    needs: pr-gate
    if: needs.pr-gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (domain layer, strict)
        run: uv run mypy src/investment_dashboard/domain

      - name: Import layering (import-linter)
        run: uv run lint-imports

      - name: Pytest
        run: uv run pytest -q --cov --cov-report=term-missing

  web:
    needs: pr-gate
    if: needs.pr-gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Parity + unit tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  frontend:
    needs: pr-gate
    if: needs.pr-gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: OpenAPI drift guard (backend/openapi.json)
        working-directory: backend
        run: |
          uv sync --extra dev
          uv run python -m investment_dashboard.tools.export_openapi /tmp/o.json
          diff -u openapi.json /tmp/o.json

      - name: API types drift guard (src/lib/api-types.ts)
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-types.ts

  e2e:
    needs: pr-gate
    if: needs.pr-gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        working-directory: frontend
        run: |
          export E2E_PASSWORD="$(openssl rand -hex 16)"
          npx playwright test

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  image:
    needs: pr-gate
    if: needs.pr-gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t inv-app:ci .

      - name: Smoke test /api/health
        run: |
          docker run -d --name inv-smoke -p 8000:8000 \
            -e INV_DASHBOARD_DB_PASSPHRASE="$(openssl rand -hex 16)" \
            -e INV_DASHBOARD_COOKIE_SECURE=false \
            inv-app:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs inv-smoke; exit 1; fi
          # The database must be encrypted, and an existing encrypted database must
          # reopen (boot runs migrations on it) after a restart.
          docker exec inv-smoke python -c "import sys; sys.exit(open('/data/app.sqlite','rb').read(16).startswith(b'SQLite format 3'))"
          # The CLI tools run outside the app's boot and must load the key too.
          openssl rand -hex 16 | docker exec -i inv-smoke inv-dashboard-set-password --stdin
          # The server needs its scheduler (price refresh, sealed backups).
          docker exec inv-smoke python -c "from investment_dashboard.config import get_settings; assert get_settings().scheduler_enabled"
          docker restart inv-smoke
          ok=
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs inv-smoke; exit 1; fi
          docker rm -f inv-smoke

      - name: SQLCipher check (encrypt, reopen, fail without key)
        run: |
          docker run --rm --entrypoint python inv-app:ci -c '
          import sqlcipher3, tempfile, os
          p = os.path.join(tempfile.mkdtemp(), "t.sqlite")
          c = sqlcipher3.connect(p)
          c.execute("PRAGMA key = '"'"'throwaway-key'"'"'")
          c.execute("CREATE TABLE t (x INTEGER)")
          c.execute("INSERT INTO t VALUES (1)")
          c.commit(); c.close()
          assert not open(p, "rb").read().startswith(b"SQLite format 3")
          c = sqlcipher3.connect(p)
          c.execute("PRAGMA key = '"'"'throwaway-key'"'"'")
          assert c.execute("SELECT x FROM t").fetchone() == (1,)
          c.close()
          c = sqlcipher3.connect(p)
          try:
              c.execute("SELECT x FROM t")
              raise SystemExit("opened without key")
          except sqlcipher3.DatabaseError:
              print("ok: encrypted, needs key")
          '
