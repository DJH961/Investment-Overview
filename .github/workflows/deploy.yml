name: Deploy

# Build the v6 image, push it to GHCR, then pull it on the Hetzner server over
# Tailscale. INERT until the owner sets the repository variable
# DEPLOY_ENABLED=true (see deploy/RUNBOOK.md, "Secrets"). Everything lives in
# /opt/investments on the server (compose file, .env, app.env, rclone.conf).

on:
  workflow_run:
    # "CI" is the workflow name; the file path is listed too because an
    # unnamed workflow is identified by its path.
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Only used when the repository variable DEPLOY_MODE is "scheduled": weekdays
  # 21:30 UTC, weekends every 4 hours. Deploys the latest main commit when its CI
  # is green and it is not the commit that was last deployed successfully.
  schedule:
    - cron: "30 21 * * 1-5"
    - cron: "0 */4 * * 0,6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/djh961/investment-overview
  SERVER: hetzner-djh-v1
  SERVER_USER: daniel

jobs:
  # DEPLOY_MODE (repository variable): "immediate" (default) deploys every green
  # push to main; "scheduled" deploys only on the schedule above, or at once when
  # the pushed commit message has a "Deploy: now" trailer line. Manual runs
  # (workflow_dispatch) always deploy.
  gate:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' ||
       (github.event_name == 'schedule' && vars.DEPLOY_MODE == 'scheduled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - name: Decide whether to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ vars.DEPLOY_MODE }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          go=true
          if [ "$EVENT" = "workflow_run" ] && [ "$MODE" = "scheduled" ]; then
            printf '%s\n' "$COMMIT_MESSAGE" | grep -qxE 'Deploy: now[[:space:]]*' || go=false
          elif [ "$EVENT" = "schedule" ]; then
            ci_ok=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success&event=push&per_page=1" --jq '.total_count')
            last=$(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
            if [ "${ci_ok:-0}" = "0" ]; then
              echo "CI is not green for $SHA; nothing to deploy"; go=false
            elif [ "$last" = "$SHA" ]; then
              echo "$SHA is already deployed"; go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    # Only ever deploy a commit that was pushed to main of THIS repository and
    # passed CI. workflow_run also fires for pull requests (including forks, whose
    # head_branch can be named "main"), so the event and the repository are
    # checked explicitly. Manual runs must be started on main.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      needs.gate.outputs.go == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == 'main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The deploy secrets live in this environment (restrict it to the main branch
    # in the repository settings; see deploy/RUNBOOK.md).
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Work out the image tag
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Join the tailnet
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare SSH
        # The server's host key comes from a secret (output of
        # `ssh-keyscan -t ed25519 <server>` taken from a trusted network), never from
        # a scan at deploy time.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Secret DEPLOY_KNOWN_HOSTS is not set" >&2
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on the server
        # The deploy key is restricted to /opt/investments/deploy.sh (forced
        # command), so there is no scp and no shell: the deploy files travel as a
        # tar stream on stdin and the tag as the command (deploy/deploy.sh checks
        # both).
        env:
          NEW_TAG: ${{ steps.tag.outputs.sha }}
        run: |
          tar -C deploy -czf - docker-compose.yml Caddyfile restore.sh first_install.sh \
            | ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
                "$SERVER_USER@$SERVER" "deploy $NEW_TAG"
